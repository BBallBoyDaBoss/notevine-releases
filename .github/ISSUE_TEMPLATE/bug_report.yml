name: Report a bug
description: Something doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make Notevine better. Reports are public, so leave out anything private.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to repeat it
      placeholder: |
        1. Open a notebook in Infinite view
        2. ...
  - type: input
    id: version
    attributes:
      label: Notevine version
      description: Filled in when you open this form from the app (Settings, Report a bug).
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
  - type: input
    id: device
    attributes:
      label: Tablet model
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: In Notevine, open Settings, Save diagnostics report, then drag the file here. It holds no notebook content.
